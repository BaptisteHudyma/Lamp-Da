name: Release

# Prepares a release from the latest commit of main. Run it manually, as an
# admin, once main contains everything for the release:
#   1. checks that the main CI passed on that commit
#   2. reads the version from src/user/constants.h (USER_SOFTWARE_VERSION_*)
#      and fails if the tag v<major>.<minor> already exists
#   3. builds the firmware of every lamp type in the CI image
#   4. creates the tag on that commit, and a DRAFT release with the binaries
#      and the auto-generated list of changes
# The draft is only visible to maintainers: write the release notes, check
# the binaries and publish it by hand. To start over, delete the draft
# release and the tag (git push --delete origin v<major>.<minor>).
#
# The binaries are attached to the draft release (gh release download
# v<major>.<minor>), and also kept as a workflow artifact.

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'BaptisteHudyma/Lamp-Da'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # check the main CI result
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      image: ${{ steps.image.outputs.name }}

    steps:
    - name: check admin
      env:
        GH_TOKEN: ${{ github.token }}
        ACTOR: ${{ github.triggering_actor }}
      run: |
        permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" --jq .permission)
        if [ "$permission" != "admin" ]; then
          echo "::error title=Not allowed::only admins can make a release ($ACTOR is '$permission')"
          exit 1
        fi

    - uses: actions/checkout@v6
      with:
        persist-credentials: false
        ref: main

    - name: commit
      id: commit
      run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: check main CI
      env:
        GH_TOKEN: ${{ github.token }}
        SHA: ${{ steps.commit.outputs.sha }}
      run: |
        passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/lamp-main.yml/runs?head_sha=$SHA&branch=main&status=success" \
          --jq .total_count)
        if [ "$passed" -eq 0 ]; then
          echo "::error title=Main CI not passed::the main CI has not succeeded on $SHA (still running, failed or not run)"
          exit 1
        fi

    - name: version
      id: version
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        major=$(grep -oP 'USER_SOFTWARE_VERSION_MAJOR\s*=\s*\K[0-9]+' src/user/constants.h)
        minor=$(grep -oP 'USER_SOFTWARE_VERSION_MINOR\s*=\s*\K[0-9]+' src/user/constants.h)
        if [ -z "$major" ] || [ -z "$minor" ]; then
          echo "::error title=Version not found::USER_SOFTWARE_VERSION_MAJOR/MINOR not found in src/user/constants.h"
          exit 1
        fi
        tag="v$major.$minor"
        if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" > /dev/null 2>&1; then
          echo "::error title=Tag exists::$tag already exists: increase the version in src/user/constants.h, or delete the tag"
          exit 1
        fi
        echo "version=${major}_${minor}" >> "$GITHUB_OUTPUT"
        echo "tag=$tag" >> "$GITHUB_OUTPUT"

    - name: find CI image
      id: image
      run: |
        image="$(tools/ci/image-name.sh)"
        if ! docker manifest inspect "$image" > /dev/null 2>&1; then
          echo "::error title=CI image not found::$image is not published: run the 'CI image' workflow on main first (see docs/CIImage.md)"
          exit 1
        fi
        echo "name=$image" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    needs: [prepare]
    container:
      image: ${{ needs.prepare.outputs.image }}
    defaults:
      run:
        working-directory: ./LampColorControler

    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
        path: LampColorControler # the Makefile requires this folder name
        ref: ${{ needs.prepare.outputs.sha }}
        submodules: 'true'

    - name: check dependencies
      run: make check-arduino-deps

    # every build writes _build/uf2/<LMBD_LAMP_TYPE>.uf2, and indexable-hd is
    # built as LMBD_LAMP_TYPE=indexable: copy each binary before the next build
    - name: build all lamp types
      env:
        VERSION: ${{ needs.prepare.outputs.version }}
      run: |
        set -e
        mkdir -p dist
        build() { # <make target> <produced uf2> <release name>
          rm -f "_build/uf2/$2.uf2"
          make clean "$1"
          test -f "_build/uf2/$2.uf2"
          cp "_build/uf2/$2.uf2" "dist/$3_$VERSION.uf2"
        }
        build simple       simple    simple
        build cct          cct       cct
        build indexable    indexable indexable
        build indexable-hd indexable indexable_hd
        ls -l dist
        (cd dist && sha256sum *.uf2 | tee SHA256SUMS)

    - uses: actions/upload-artifact@v4
      with:
        name: firmware-${{ needs.prepare.outputs.tag }}
        path: LampColorControler/dist/
        if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [prepare, build]
    permissions:
      contents: write # tag and draft release

    steps:
    - uses: actions/download-artifact@v4
      with:
        name: firmware-${{ needs.prepare.outputs.tag }}
        path: dist

    - name: tag
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ needs.prepare.outputs.tag }}
        SHA: ${{ needs.prepare.outputs.sha }}
      # lightweight tag, like the previous releases
      run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$SHA" > /dev/null

    - name: draft release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ needs.prepare.outputs.tag }}
      run: |
        url=$(gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
          --title "${TAG#v}" --generate-notes dist/*)
        echo "Draft release: $url" >> "$GITHUB_STEP_SUMMARY"
