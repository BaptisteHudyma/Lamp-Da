name: Lamp-Da main branch CI

on:
  pull_request: # on pull request changes to the folders below, run CI
    paths:
      - "src/**"
      - "simulator/**"
      - "tests/**"
      - "tools/**"
      - "Makefile"
      - "requirements.txt"
      - ".dockerignore"
      - ".github/workflows/lamp-main.yml"
  push: # on merge to main, run CI
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

defaults:
  run:
    shell: bash
    working-directory: ./LampColorControler

# All jobs run in the CI image (tools/ci/Dockerfile), which already contains
# every dependency. Its tag is a hash of the environment files, so a change to
# them requires running the "CI image" workflow first. See docs/CIImage.md.

jobs:
  ci-image:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.image.outputs.name }}

    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
        path: LampColorControler
    - name: find CI image
      id: image
      run: |
        image="$(tools/ci/image-name.sh)"
        if ! docker manifest inspect "$image" > /dev/null 2>&1; then
          echo "::error title=CI image not found::$image is not published. The build environment changed (tools/ci/, requirements.txt, tools/arduino-cli or .dockerignore): a maintainer must run the 'CI image' workflow on this branch (see docs/CIImage.md). If it was just published, check that the ghcr.io package is public."
          exit 1
        fi
        echo "Using $image"
        echo "name=$image" >> "$GITHUB_OUTPUT"

  format:
    runs-on: ubuntu-latest
    needs: [ci-image]
    container:
      image: ${{ needs.ci-image.outputs.name }}

    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
        path: LampColorControler
        submodules: 'true'
    - name: verify format
      run : make format-verify

  run-tests:
    runs-on: ubuntu-latest
    needs: [ci-image] # runs in parallel with format, builds wait for both
    container:
      image: ${{ needs.ci-image.outputs.name }}
      options: --cap-add=SYS_PTRACE # LeakSanitizer needs ptrace

    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
        path: LampColorControler
        submodules: 'true'
    - name: build
      run:
        make test
    - name: utest
      run:
        make run-utest
    - name: itest
      run:
        make run-itest

  documentation:
    runs-on: ubuntu-latest
    needs: [ci-image]
    container:
      image: ${{ needs.ci-image.outputs.name }}

    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
        path: LampColorControler
        submodules: 'true'
    - name: Documentation
      run :
        make doc

  build-lamp:
    runs-on: ubuntu-latest
    needs: [ci-image, format, run-tests]
    container:
      image: ${{ needs.ci-image.outputs.name }}

    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
        path: LampColorControler
        submodules: 'true'
    - name: check dependencies
      run : make check-arduino-deps
    - name: simple led strip build
      run : make clean simple
    - name: cct led strip build
      run : make clean cct
    - name: indexable HD led strip build
      run : make clean indexable-hd
    - name: indexable led strip build
      run : make clean indexable

  build-simulator:
    runs-on: ubuntu-latest
    needs: [ci-image, format, run-tests]
    container:
      image: ${{ needs.ci-image.outputs.name }}

    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
        path: LampColorControler
        submodules: 'true'
    - name: build indexable
      run: make clean simulator-indexable simulator
    - name: build indexable-hd simulator
      run: make clean simulator-indexable-hd
    - name: build simple simulator
      run: make clean simulator-simple
